<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'todo/css/style.css' %}">
</head>
<body>

<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h1>Login</h1>
            <p>Welcome to the task manager</p>
        </div>

        {# Show one concise message instead of exposing authentication details. #}
        <form id="login-form" novalidate>

            <div class="field">
                <label for="login-email">Email</label>
                <input id="login-email" name="email" type="email" autocomplete="email" required>
            </div>

            <div class="field">
                <label for="login-password">Password</label>
                <input id="login-password" name="password" type="password" autocomplete="current-password" required>
            </div>

            <div id="login-error" class="alert alert-error hidden" role="alert"></div>

            <button type="submit" class="btn btn-primary btn-block">Login</button>
        </form>

        <p class="auth-footer">
            Don't have an account?
            <a href="{% url 'signup' %}">Sign up</a>
        </p>
    </div>
</div>

<script>
  document.getElementById('login-form').addEventListener('submit', async function (event) {
    event.preventDefault();
    const error = document.getElementById('login-error');
    const button = this.querySelector('button[type="submit"]');
    error.classList.add('hidden');
    button.disabled = true;
    try {
      const response = await fetch('/todo/api/v1/token/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({
          email: document.getElementById('login-email').value.trim(),
          password: document.getElementById('login-password').value
        })
      });
      if (!response.ok) throw new Error('Email or password is incorrect.');
      const tokens = await response.json();
      sessionStorage.setItem('todo.access', tokens.access);
      sessionStorage.setItem('todo.refresh', tokens.refresh);
      window.location.assign('/todo/');
    } catch (err) {
      error.textContent = err.message || 'Unable to sign in. Please try again.';
      error.classList.remove('hidden');
      button.disabled = false;
    }
  });
</script>

</body>
</html>
